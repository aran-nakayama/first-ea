[project]
name = "first-ea"
version = "0.1.0"
description = "USD/JPY Mean Reversion EA - Backtesting & Optimization"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.36",
    "backtesting>=0.3.3",
    "ta>=0.11.0",
    "plotly>=5.18",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
